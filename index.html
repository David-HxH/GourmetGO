<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-bs-theme="dark">
    <header class="p-4">
      <header>
        <div id="hero-header">
          <div class="container text-center py-5">
            <h1 class="mb-3">Recetas del Mundo</h1>
            <p id="p-hero">
              Explora deliciosas recetas de diferentes culturas y países.
            </p>
          </div>
        </div>
      </header>
    </header>
    <main>
      <div class="container">
        <form class="row justify-content-center mb-4" id="formulario-busqueda">
          <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <div class="d-flex gap-2 w-100">
              <div class="position-relative flex-grow-1">
                <input
                  type="search"
                  name="searchForm"
                  class="form-control pe-5"
                  placeholder="Busca por ingrediente (en Ingles)..."
                />

                <i
                  class="bi bi-search position-absolute end-0 top-50 translate-middle-y me-3"
                ></i>
              </div>

              <button class="btn btn-primary">Buscar</button>
            </div>
          </div>
        </form>
      </div>

      <section class="sectionRecetas my-4">
        <div class="container p-0 my-2">
          <div class="row g-4 justify-content-center" id="contenedor-recetas">
            <!-- Resultados dinámicos -->
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="container text-center py-4">
        <p class="mb-0 text-secondary">
          &copy; 2025 David Mondaca. Todos los derechos reservados
        </p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="assets/js/app.js" defer></script>
  </body>
</html>
